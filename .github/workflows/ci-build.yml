# Validate that the project builds on Ubuntu and macOS (no model download).
name: CI Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential pkg-config libopenblas-dev
          mkdir build && cd build
          cmake .. -DGGML_BLAS=ON
          cmake --build . --config Release -j$(nproc)

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir build && cd build
          cmake ..
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Smoke test
        run: |
          ./build/ace-lm --help 2>&1 | head -5
          ./build/ace-synth --help 2>&1 | head -5
          ./build/quantize --help 2>&1 | head -3

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format clang-tidy cppcheck

      - name: Run clang-format (check mode)
        run: |
          find . \
          \( -path './.git' -o -path './ggml' -o -path './build' -o -path './vendor' -o -path './mp3' \) -prune -o \
          -type f \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' -o -name '*.hpp' \) \
          -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Run cppcheck
        run: |
          set -euo pipefail
          cppcheck --enable=all --inline-suppr \
            --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
            -i ggml -i build -i .git -i mp3 . > cppcheck.log 2>&1 || { cat cppcheck.log >&2; exit 1; }

          # Keep vendored diagnostics visible. Cppcheck 2.19 flags two safe four-byte copies in yyjson 0.12.0.
          awk '
            BEGIN { failure = "cppcheck-first-party.log"; advisory = "cppcheck-advisory.log"; vendor = "cppcheck-vendor.log";
                    printf "" > failure; printf "" > advisory; printf "" > vendor }
            /^(vendor|mp3|ggml)\// { print > vendor; next }
            /^[^:]+:[0-9]+:[0-9]+: (warning|error):/ { print > failure; next }
            /^[^:]+:[0-9]+:[0-9]+:/ { print > advisory }
          ' cppcheck.log
          if [ -s cppcheck-first-party.log ]; then
            cat cppcheck-first-party.log >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-reports
          path: cppcheck*.log
